esphome:
  name: wii-balance-board
  friendly_name: "Wii Balance Board"

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: arduino
    sdkconfig_options:
      CONFIG_BT_ENABLED: y
      CONFIG_BLUEDROID_ENABLED: y
      CONFIG_CLASSIC_BT_ENABLED: y
      CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY: y

# Enable logging
logger:
  level: DEBUG

# Local device dashboard
web_server:
  port: 80

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: LIGHT

external_components:
  - source:
      type: local
      path: ./wii_balance_board_component
    components: [ wii_balance_board ]

wii_balance_board:
  id: wbb
  standard_deviation: 0.3
  led_pin: 2
  temperature_sensor:
    name: "Temperature"
  reference_temperature_sensor:
    name: "Reference temperature"
  battery_level:
    name: "Battery level"
  weight:
    name: "Weight"
  syncing:
    name: "Syncing"
  calibration_status:
    name: "Calibration status"

text:
  - platform: template
    name: "Calibration weight"
    mode: text
    min_length: 1
    max_length: 6
    pattern: "(?:[2-9][0-9]|1[0-4][0-9]|150)(?:[.,][0-9]{1,2})?"
    optimistic: true
    set_action:
      then:
        - lambda: 'id(wbb)->set_calibration_reference_weight(x);'

button:
  - platform: template
    name: "Start sync"
    on_press:
      then:
        - lambda: 'id(wbb)->sync(true);'
  - platform: template
    name: "Calibration"
    on_press:
      then:
        - lambda: 'id(wbb)->calibration_button();'
