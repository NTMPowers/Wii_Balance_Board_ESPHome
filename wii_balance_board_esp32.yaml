esphome:
  name: wii-balance-board
  friendly_name: "Wii Balance Board"

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: arduino
    sdkconfig_options:
      CONFIG_BT_ENABLED: y
      CONFIG_BLUEDROID_ENABLED: y
      CONFIG_CLASSIC_BT_ENABLED: y
      CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY: y
      # Keep the BT radio out of low-power modem sleep so it isn't power-cycling and
      # potentially missing the board's incoming page while Wi-Fi is active.
      CONFIG_BTDM_CTRL_MODEM_SLEEP: n

# Enable logging
logger:
  level: DEBUG

# Local device dashboard
web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: readings
      name: Readings
      sorting_weight: 10
    - id: calibration
      name: Calibration
      sorting_weight: 20
    - id: controls
      name: Controls
      sorting_weight: 30

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # NONE keeps the Wi-Fi radio always active instead of duty-cycling with modem sleep, which
  # removes a source of coexistence jitter that can shrink Bluetooth's page-scan windows.
  power_save_mode: NONE

external_components:
  - source:
      type: local
      path: ./wii_balance_board_component
    components: [ wii_balance_board ]

wii_balance_board:
  id: wbb
  standard_deviation: 0.3
  led_pin: 2
  temperature_sensor:
    name: "Temperature"
    web_server:
      sorting_group_id: readings
      sorting_weight: 30
  reference_temperature_sensor:
    name: "Reference temperature"
    web_server:
      sorting_group_id: readings
      sorting_weight: 40
  battery_level:
    name: "Battery level"
    web_server:
      sorting_group_id: readings
      sorting_weight: 20
  weight:
    name: "Weight"
    web_server:
      sorting_group_id: readings
      sorting_weight: 10
  syncing:
    name: "Syncing"
    web_server:
      sorting_group_id: readings
      sorting_weight: 50
  calibration_status:
    name: "Calibration status"
    web_server:
      sorting_group_id: calibration
      sorting_weight: 10

text:
  - platform: template
    name: "Calibration weight"
    web_server:
      sorting_group_id: calibration
      sorting_weight: 20
    mode: text
    min_length: 1
    max_length: 6
    pattern: "(?:[2-9][0-9]|1[0-4][0-9]|150)(?:[.,][0-9]{1,2})?"
    optimistic: true
    set_action:
      then:
        - lambda: 'id(wbb)->set_calibration_reference_weight(x);'

button:
  - platform: template
    name: "Start sync"
    web_server:
      sorting_group_id: controls
      sorting_weight: 10
    on_press:
      then:
        - lambda: 'id(wbb)->sync(true);'
  - platform: template
    name: "Calibration"
    web_server:
      sorting_group_id: calibration
      sorting_weight: 30
    on_press:
      then:
        - lambda: 'id(wbb)->calibration_button();'
