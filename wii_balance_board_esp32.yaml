esphome:
  name: wii-balance-board
  friendly_name: "Wii Balance Board"

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: arduino
    sdkconfig_options:
      CONFIG_BT_ENABLED: y
      CONFIG_BLUEDROID_ENABLED: y
      CONFIG_CLASSIC_BT_ENABLED: y
      CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY: y
      CONFIG_BTDM_CTRL_MODEM_SLEEP: n

logger:
  level: INFO

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: readings
      name: "Wii Balance Board"
      sorting_weight: 10
    - id: config
      name: "Config"
      sorting_weight: 30

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: ./wii_balance_board_component
    components: [ wii_balance_board ]
    
globals:
  - id: loading_offset
    type: bool
    initial_value: 'false'

wii_balance_board:
  id: wbb
  led_pin: 22
  led_inverted: true
  temperature_sensor:
    name: "Temperature"
    web_server:
      sorting_group_id: readings
      sorting_weight: 30
  reference_temperature_sensor:
    name: "Reference temperature"
    web_server:
      sorting_group_id: readings
      sorting_weight: 40
  battery_level:
    name: "Battery level"
    web_server:
      sorting_group_id: readings
      sorting_weight: 20
  weight:
    name: "Weight"
    web_server:
      sorting_group_id: readings
      sorting_weight: 10
  syncing:
    name: "Syncing"
    web_server:
      sorting_group_id: config
      sorting_weight: 30
  ready_to_step_on:
    name: "Ready to weigh"
    web_server:
      sorting_group_id: readings
      sorting_weight: 1
  on_offset_loaded:
    then:
      - lambda: |-
          id(loading_offset) = true;
          char buf[16];
          snprintf(buf, sizeof(buf), "%.2f", offset);
          id(offset_text).publish_state(buf);
          id(loading_offset) = false;

button:
  - platform: template
    name: "Start sync"
    icon: "mdi:bluetooth-connect"
    web_server:
      sorting_group_id: config
      sorting_weight: 20
    on_press:
      then:
        - lambda: 'id(wbb)->sync(true);'
  - platform: template
    name: "Remove board"
    icon: "mdi:bluetooth-off"
    web_server:
      sorting_group_id: config
      sorting_weight: 40
    on_press:
      then:
        - lambda: 'id(wbb)->remove_link_key();'
  - platform: template
    name: "Remove all boards"
    icon: "mdi:delete-sweep"
    web_server:
      sorting_group_id: config
      sorting_weight: 50
    on_press:
      then:
        - lambda: 'id(wbb)->remove_all_link_keys();'

text:
  - platform: template
    id: offset_text
    name: "Weight offset"
    icon: "mdi:scale-balance"
    mode: text
    optimistic: true
    web_server:
      sorting_group_id: config
      sorting_weight: 10
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(loading_offset);'
            then:
              - lambda: 'id(wbb)->set_offset(x);'
