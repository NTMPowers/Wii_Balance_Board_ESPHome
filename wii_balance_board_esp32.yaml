esphome:
  name: wii-balance-board
  friendly_name: "Wii Balance Board"

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: arduino
    sdkconfig_options:
      CONFIG_BT_ENABLED: y
      CONFIG_BLUEDROID_ENABLED: y
      CONFIG_CLASSIC_BT_ENABLED: y
      CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY: y
      CONFIG_BTDM_CTRL_MODEM_SLEEP: n

# Enable logging
logger:
  level: VERBOSE

# Local device dashboard
web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: readings
      name: Readings
      sorting_weight: 10
    - id: controls
      name: Controls
      sorting_weight: 30

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: LIGHT

external_components:
  - source:
      type: local
      path: ./wii_balance_board_component
    components: [ wii_balance_board ]

wii_balance_board:
  id: wbb
  standard_deviation: 0.3
  led_pin: 2
  temperature_sensor:
    name: "Temperature"
    web_server:
      sorting_group_id: readings
      sorting_weight: 30
  reference_temperature_sensor:
    name: "Reference temperature"
    web_server:
      sorting_group_id: readings
      sorting_weight: 40
  battery_level:
    name: "Battery level"
    web_server:
      sorting_group_id: readings
      sorting_weight: 20
  weight:
    name: "Weight"
    web_server:
      sorting_group_id: readings
      sorting_weight: 10
  syncing:
    name: "Syncing"
    web_server:
      sorting_group_id: readings
      sorting_weight: 50
  ready_to_step_on:
    name: "Ready to step on"
    web_server:
      sorting_group_id: readings
      sorting_weight: 60

button:
  - platform: template
    name: "Start sync"
    web_server:
      sorting_group_id: controls
      sorting_weight: 10
    on_press:
      then:
        - lambda: 'id(wbb)->sync(true);'
